<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Puper Online Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: #fff; }
    canvas { background: #333; display: block; margin: 0 auto; }
    #chatContainer { position: absolute; bottom: 0; left: 0; width: 300px; height: 40%; display: flex; flex-direction: column; font-family: Arial, sans-serif; }
    #chatLog { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.6); padding: 4px; font-size: 12px; }
    #chatInput { border: none; padding: 6px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div id="chatContainer">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Type message & press Enter" autocomplete="off" />
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io();

    // Ask user for nickname and send to server
    const nickname = prompt('Enter your nickname') || '';
    if (nickname.trim().length) {
      socket.emit('setNickname', nickname.trim());
    }

    const canvas = document.getElementById('gameCanvas');
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const ctx = canvas.getContext('2d');

    let myId = null;
    let players = {};
    let worldWidth = 800;
    let worldHeight = 600;
    let playerSize = 20;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const id in players) {
        const p = players[id];
        ctx.fillStyle = p.color || (id === myId ? 'orange' : 'cyan');
        ctx.fillRect(p.x, p.y, playerSize, playerSize);
        // Draw nickname
        ctx.font = '12px Arial';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        const nickText = p.nick || (id === myId ? 'Me' : '');
        if (nickText) {
          ctx.fillText(nickText, p.x + playerSize / 2, p.y - 4);
        }
      }
      requestAnimationFrame(draw);
    }

    socket.on('init', (data) => {
      myId = data.id;
      players = data.players;
      if (data.world) {
        worldWidth = data.world.width;
        worldHeight = data.world.height;
        playerSize = data.world.playerSize;
        canvas.width = worldWidth;
        canvas.height = worldHeight;
      }
      draw();
    });

    socket.on('playerJoined', (data) => {
      players[data.id] = data.player;
    });

    socket.on('playerMoved', (data) => {
      players[data.id] = data.player;
    });

    socket.on('playerLeft', (data) => {
      delete players[data.id];
    });

    socket.on('nicknameChanged', (data) => {
      if (players[data.id]) {
        players[data.id].nick = data.nick;
      }
    });

    // Chat: receive messages
    socket.on('chat', (payload) => {
      const div = document.createElement('div');
      const time = new Date(payload.time);
      const hh = String(time.getHours()).padStart(2, '0');
      const mm = String(time.getMinutes()).padStart(2, '0');
      div.textContent = `[${hh}:${mm}] ${payload.nick}: ${payload.message}`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    });

    // Chat: send on Enter
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const text = chatInput.value.trim();
        if (text.length) {
          socket.emit('chat', text);
          chatInput.value = '';
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      const p = players[myId];
      if (!p) return;
      const speed = 5;
      switch (e.key) {
        case 'ArrowUp': p.y -= speed; break;
        case 'ArrowDown': p.y += speed; break;
        case 'ArrowLeft': p.x -= speed; break;
        case 'ArrowRight': p.x += speed; break;
      }
      // Clamp locally before sending
      p.x = Math.max(0, Math.min(worldWidth - playerSize, p.x));
      p.y = Math.max(0, Math.min(worldHeight - playerSize, p.y));
      socket.emit('move', { x: p.x, y: p.y });
    });
  </script>
</body>
</html>
