<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="ETERNAL REALMS - Эпическая многопользовательская онлайн RPG игра" />
    <meta name="keywords" content="MMORPG, онлайн игра, фантези, RPG, многопользовательская игра" />
    <meta name="author" content="Eternal Realms Team" />
    <meta name="theme-color" content="#1a1a2e" />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/fonts/MedievalSharp-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/sounds/ambient/menu.mp3" as="audio" />
    <link rel="preload" href="/images/ui/loading-bg.webp" as="image" />
    
    <!-- Game Icons -->
    <link rel="icon" type="image/svg+xml" href="/images/icons/game-icon.svg" />
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
    
    <!-- Performance optimizations -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Game specific meta -->
    <meta name="game-version" content="1.0.0" />
    <meta name="min-screen-width" content="1024" />
    <meta name="min-screen-height" content="768" />
    
    <title>ETERNAL REALMS - Эпическая MMORPG</title>
    
    <!-- Critical CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'MedievalSharp', 'Cinzel', serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        #root {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .game-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/images/ui/loading-bg.webp') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loader-logo {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        .loader-text {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        
        .loader-progress {
            width: 400px;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .loader-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        
        /* Hide scrollbars but keep functionality */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="game-loader" id="gameLoader">
            <img src="/images/ui/eternal-realms-logo.png" alt="Eternal Realms" class="loader-logo" />
            <div class="loader-text">Загрузка магических миров...</div>
            <div class="loader-progress">
                <div class="loader-bar" id="loaderBar"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Game initialization script -->
    <script>
        // Prevent context menu and other browser defaults
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        
        // Game loading progress simulation
        let progress = 0;
        const loaderBar = document.getElementById('loaderBar');
        const gameLoader = document.getElementById('gameLoader');
        
        const updateProgress = () => {
            progress += Math.random() * 15;
            if (progress > 100) progress = 100;
            loaderBar.style.width = progress + '%';
            
            if (progress >= 100) {
                setTimeout(() => {
                    gameLoader.style.opacity = '0';
                    gameLoader.style.transition = 'opacity 1s ease';
                    setTimeout(() => {
                        gameLoader.style.display = 'none';
                    }, 1000);
                }, 500);
            } else {
                setTimeout(updateProgress, 100 + Math.random() * 200);
            }
        };
        
        setTimeout(updateProgress, 500);
    </script>
</body>
</html>
