<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Super Online Game MVP</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #chatLog { position: absolute; bottom: 40px; left: 10px; width: 300px; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.5); color: #eee; font-size: 12px; padding: 4px; border-radius:4px; }
    #chatInput { position: absolute; bottom: 10px; left: 10px; width: 300px; box-sizing:border-box; padding:4px; border-radius:4px; border:1px solid #666; pointer-events: auto; background:#111; color:#eee; }
    canvas { background: #222; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="ui">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Press Enter to chat" autocomplete="off" />
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const state = { players: {}, projectiles: [] };

    let lastDir = { dx: 1, dy: 0 };

    socket.on('init', ({ id, state: serverState }) => {
      Object.assign(state.players, serverState.players);
      state.projectiles = serverState.projectiles;
      socket.id = id;
      const name = prompt('Enter your name:','');
      if (name) socket.emit('setName', name);
      draw();
    });

    socket.on('state', (serverState) => {
      state.players = serverState.players;
      state.projectiles = serverState.projectiles;
      draw();
    });

    socket.on('playerJoined', ({ id }) => {
      state.players[id] = { x: 0, y: 0, health: 100, score: 0 };
      draw();
    });

    socket.on('playerLeft', ({ id }) => {
      delete state.players[id];
      draw();
    });

    document.addEventListener('keydown', (e) => {
      const moveStep = 5;
      let dx = 0, dy = 0;
      if (e.key === 'ArrowUp') dy = -moveStep;
      if (e.key === 'ArrowDown') dy = moveStep;
      if (e.key === 'ArrowLeft') dx = -moveStep;
      if (e.key === 'ArrowRight') dx = moveStep;

      if (dx || dy) {
        socket.emit('move', { dx, dy });
        lastDir = { dx, dy };
      }

      if (e.code === 'Space') {
        socket.emit('shoot', lastDir);
      }
    });

    // Chat handling
    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const msg = chatInput.value.trim();
        if (msg) {
          socket.emit('chat', msg);
          chatInput.value = '';
        }
      }
      e.stopPropagation();
    });

    socket.on('chat', ({ name, message }) => {
      const chatLog = document.getElementById('chatLog');
      const div = document.createElement('div');
      div.textContent = `${name}: ${message}`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw projectiles
      state.projectiles.forEach(({ x, y }) => {
        ctx.fillStyle = 'red';
        const canvasPos = worldToCanvas(x, y);
        ctx.beginPath();
        ctx.arc(canvasPos.x, canvasPos.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw players
      Object.entries(state.players).forEach(([id, p]) => {
        const { x, y, health, score } = p;
        const canvasPos = worldToCanvas(x, y);
        ctx.fillStyle = id === socket.id ? 'cyan' : 'white';
        ctx.beginPath();
        ctx.arc(canvasPos.x, canvasPos.y, 12, 0, Math.PI * 2);
        ctx.fill();

        // health bar
        ctx.fillStyle = 'green';
        const barWidth = 24;
        ctx.fillRect(canvasPos.x - barWidth / 2, canvasPos.y - 20, (health / 100) * barWidth, 4);

        // score text
        ctx.fillStyle = 'yellow';
        ctx.font = '10px sans-serif';
        ctx.fillText(score, canvasPos.x - 3, canvasPos.y + 24);

        // name label
        ctx.fillStyle = 'white';
        ctx.font = '11px sans-serif';
        ctx.fillText(p.name || 'Anon', canvasPos.x - ctx.measureText(p.name || 'Anon').width / 2, canvasPos.y - 28);
      });
    }

    function worldToCanvas(wx, wy) {
      return { x: 400 + wx, y: 300 + wy };
    }
  </script>
</body>
</html>
